[package]
name = "ondevice_core"
version = "0.1.0"
edition = "2021"
description = "LocalStore core for pairing, device connection, signing, and installation"

[lib]
name = "ondevice_core"
crate-type = ["staticlib"]

[dependencies]
# Pinned to the same revision StikPair/StikDebug build against, so both the
# RPPairing host (StikPair) and the loopback RSD tunnel (StikDebug's
# tunnel_create_rppairing) we replicate match known-good implementations.
#
# Keep this list to the services LocalStore actually calls.  In particular,
# there is no USB transport, classic pairing, restore/debug service, DDI mount,
# backup, screenshot, or location feature in the app.
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "7bd551c16c6dd2e058740d85a2d9399a51a776e9", default-features = false, features = [
  "aws-lc",
  "remote_pairing",
  "tunnel_tcp_stack",
  "rsd",
  "xpc",
  "core_device_proxy",
  "installation_proxy",
  "afc",
] }

# idevice's OWN C-FFI crate (rlib target), pinned to the same rev. Cargo
# unifies the single `idevice` instance, so depending on both is safe (no
# duplicate symbols). We reuse its production-tested connection/install FFI
# (tunnel_create_rppairing, installation_proxy_*, afc_*, rp_pairing_file_*,
# rsd_*, lockdown_*, adapter_*) — the same surface StikDebug ships — instead of
# re-implementing the threading-sensitive RSD tunnel by hand. Its `#[no_mangle]`
# symbols are re-exported into our staticlib (see `extern crate` in lib.rs).
# We do NOT enable its mdns-based remote_pairing host; our forked pairing.rs
# advertises via Swift NetService to avoid the multicast entitlement.
# idevice-ffi, vendored under vendor/idevice-ffi with its crate-type changed to
# rlib-only (upstream is staticlib+cdylib+rlib; rustc emits all in one pass and
# the standalone cdylib link fails on the iOS *device* target). Its `idevice`
# dep points at the same git rev as our direct dep above, so cargo unifies the
# single idevice instance — no duplicate symbols. LocalStore enables only the
# FFI modules Swift calls, keeping unrelated device-management services out of
# the static library.
idevice-ffi = { path = "vendor/idevice-ffi", default-features = false, features = [
  "aws-lc",
  "afc",
  "core_device_proxy",
  "installation_proxy",
  "rppairing",
  "rsd",
  "tunnel_tcp_stack",
  "xpc",
] }

# Apple ID auth + dev cert/App ID/profile + on-device IPA signing.
# LocalStore calls only `Sideloader::sign_app`; installation is handled by the
# RSD FFI above.  The vendored crate completes isideload's existing `install`
# feature gates, so disabling that feature also removes its second, unused copy
# of idevice. `fs-storage` persists the local signer/Anisette state.
isideload = { git = "https://github.com/nab138/isideload.git", package = "isideload", default-features = false, features = [
  "fs-storage",
] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs"] }

# Serialize the certificate list across the FFI boundary as JSON (decoded by
# Swift). Both are already in the tree via isideload, so this adds no new deps.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IPA metadata extraction uses plist for Info.plist and base64 for the icon
# returned across FFI. Both are already in the tree via isideload.
plist = "1.8"
base64 = "0.22.1"
zip = "8.6.0"

# Logging spine: forward idevice's `tracing` events (and any `log` records via
# the tracing-log compat layer, enabled by default) through the FFI callback.
tracing = "0.1"
tracing-subscriber = "0.3"

# idevice's OPACK decoder rejects the back-reference tags (0xA0-0xC4) that a
# device emits when a pair record repeats a string — an iPad reporting `name`
# equal to `model` sends 0xAB, and pairing died on "unsupported OPACK tag: 0xab"
# right after the PIN was accepted. Upstream is still unfixed at the pinned rev,
# so the crate is vendored with that one change (see vendor/idevice/README.md).
# Patching the git source rather than repointing the dependency means
# idevice-ffi's own `idevice` dep resolves here too, keeping cargo's single
# unified instance and the matching-rev intent above.
[patch."https://github.com/jkcoxson/idevice.git"]
idevice = { path = "vendor/idevice" }

# isideload writes `embedded.mobileprovision` into the main .app only, never into
# PlugIns/*.appex — even though it registers an App ID for each extension and
# signs them all with the main app's entitlements. SideStore's prepareDatabase
# throws "The app extension is missing a valid provisioning profile" on every
# launch as a result (surfacing, confusingly, as a Core Data "Can't add the same
# store twice" loop), so its widget extension bricks the app. Vendored with that
# one change — see vendor/isideload/README.md.
[patch."https://github.com/nab138/isideload.git"]
isideload = { path = "vendor/isideload" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
